document_type: inspection_report
document_category: inspection
parser: pdf
default_route: qdrant

required_metadata: [language]
optional_metadata: [machine_id, inspector, inspection_date, result]

chunking:
  profile: short_form_th
  chunk_size: 800
  chunk_overlap: 100

embedding:
  profile: default_th

qdrant:
  collection: spark_docs

postgres:
  registry_only: true

dedup:
  by: file_hash_sha256
  strategy: skip_if_exists
