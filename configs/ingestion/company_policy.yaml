document_type: company_policy
document_category: enterprise
parser: pdf
default_route: qdrant

required_metadata: [language]
optional_metadata: [revision, effective_date, sensitivity_level]

chunking:
  profile: parent_child_th_v2
  strategy: page_aware_parent_child

embedding:
  profile: default_th

qdrant:
  collection: spark_enterprise_docs

postgres:
  registry_only: true

dedup:
  by: file_hash_sha256
  strategy: reingest_replace

budget:
  max_pages: 500
  max_chunks: 20000
  max_embed_tokens: 5000000
