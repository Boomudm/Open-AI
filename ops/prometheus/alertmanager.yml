# Alertmanager configuration for Neo Chat factory deployment.
# Configure receivers (Slack, email, PagerDuty) per environment.
#
# Usage: Mount to /etc/alertmanager/alertmanager.yml in alertmanager container.
# Env vars: SLACK_WEBHOOK_URL, SMTP_FROM, SMTP_TO, SMTP_SMARTHOST

global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "factory_id"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h
    - match:
        severity: warning
      receiver: default
      repeat_interval: 4h

receivers:
  - name: default
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#neo-alerts"
        send_resolved: true
        title: '{{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* ({{ .Labels.severity }})
          {{ .Annotations.description }}
          {{ end }}

  - name: critical
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#neo-critical"
        send_resolved: true
        title: 'CRITICAL: {{ .CommonAnnotations.summary }}'
        text: >-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}*
          {{ .Annotations.description }}
          Source: {{ .Labels.instance }}
          {{ end }}

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname", "factory_id"]
