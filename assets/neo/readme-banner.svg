<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="Neo Chat">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#0B1B3A"/>
      <stop offset="100%" stop-color="#04101F"/>
    </linearGradient>
    <linearGradient id="neo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>

  <!-- soft color orbs -->
  <circle cx="180" cy="90" r="160" fill="url(#orb1)" filter="url(#soft)"/>
  <circle cx="1120" cy="320" r="180" fill="url(#orb2)" filter="url(#soft)"/>
  <circle cx="980" cy="70" r="140" fill="url(#orb3)" filter="url(#soft)"/>

  <!-- grid dots -->
  <g fill="#94A3B8" opacity="0.18">
    <circle cx="80" cy="70" r="2"/><circle cx="120" cy="70" r="2"/><circle cx="160" cy="70" r="2"/>
    <circle cx="80" cy="110" r="2"/><circle cx="120" cy="110" r="2"/><circle cx="160" cy="110" r="2"/>
    <circle cx="1120" cy="80" r="2"/><circle cx="1160" cy="80" r="2"/><circle cx="1200" cy="80" r="2"/>
    <circle cx="1120" cy="120" r="2"/><circle cx="1160" cy="120" r="2"/><circle cx="1200" cy="120" r="2"/>
  </g>

  <!-- decorative sparkles -->
  <g fill="#7DD3FC">
    <path d="M240 150 l8 -22 8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 z" opacity="0.9"/>
    <path d="M1040 250 l6 -16 6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 z" opacity="0.75"/>
    <path d="M980 140 l5 -12 5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 z" opacity="0.65"/>
  </g>

  <!-- title -->
  <text x="640" y="168" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#neo)" letter-spacing="-2">Neo Chat</text>
  <rect x="430" y="190" width="420" height="3" rx="2" fill="url(#glow)"/>

  <text x="640" y="240" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="26" fill="#E2E8F0" letter-spacing="1">On-prem document RAG for factories</text>
  <text x="640" y="280" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#94A3B8">Upload | Ask in Thai / English | Get cited answers</text>

  <!-- pill chips -->
  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="310" y="320" width="140" height="36" rx="18" fill="#0EA5E9"/>
    <text x="380" y="343" text-anchor="middle" fill="#082F49">Grounded</text>

    <rect x="470" y="320" width="140" height="36" rx="18" fill="#22C55E"/>
    <text x="540" y="343" text-anchor="middle" fill="#052E16">On-prem</text>

    <rect x="630" y="320" width="140" height="36" rx="18" fill="#F59E0B"/>
    <text x="700" y="343" text-anchor="middle" fill="#451A03">Cited</text>

    <rect x="790" y="320" width="160" height="36" rx="18" fill="#A855F7"/>
    <text x="870" y="343" text-anchor="middle" fill="#2E1065">Role-aware</text>
  </g>
</svg>
