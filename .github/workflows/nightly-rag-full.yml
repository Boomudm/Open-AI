name: nightly-rag-full

# Full LLM + GPU eval on develop/release branches (Phase 12).
# Alias of nightly-rag-baseline with consolidated configs/eval paths and artifacts.

# Manual only — nightly disabled
on:
  workflow_dispatch:

jobs:
  chat-routing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run python scripts/evaluate_baseline.py --mode chat_routing

  eval-deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: |
          uv run python scripts/evaluate_baseline.py \
            --config configs/eval/baseline_ci.yaml \
            --mode rag \
            --deterministic-rag \
            --json-output docs/eval-report-nightly-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-baseline-ci-report
          path: docs/eval-report-nightly-ci.json
          if-no-files-found: ignore
          retention-days: 90

  leakage-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: >-
          uv run python scripts/eval_leakage_audit.py
          --dev configs/evaluation_baseline.yaml
          --holdout configs/evaluation_heldout.yaml

  eval-adversarial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: >-
          uv run python scripts/evaluate_baseline.py
          --suite adversarial
          --deterministic-rag
          --skip-requires-live-api
          --require-answer-path
          --json-output docs/eval-report-adversarial-nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-adversarial-report
          path: docs/eval-report-adversarial-nightly.json
          if-no-files-found: ignore
          retention-days: 90

  eval-safety-critical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: >-
          uv run python scripts/evaluate_baseline.py
          --suite safety_critical
          --deterministic-rag
          --skip-requires-live-api
          --require-answer-path
          --no-fail
          --json-output docs/eval-report-safety-critical-nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-safety-critical-report
          path: docs/eval-report-safety-critical-nightly.json
          if-no-files-found: ignore
          retention-days: 90

  eval-full-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Full LLM baseline (when Ollama URL configured)
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          EVAL_PASS_THRESHOLD: "75"
        run: |
          if [[ -n "${OLLAMA_BASE_URL:-}" ]]; then
            bash scripts/nightly-eval.sh
          else
            echo "OLLAMA_BASE_URL not set — run scripts/nightly-eval.sh on factory cron."
            exit 0
          fi

  eval-full-llm-gpu:
    runs-on: [self-hosted, gpu]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Production-path LLM baseline on self-hosted GPU
        env:
          EVAL_PASS_THRESHOLD: "90.91"
        run: bash scripts/nightly-eval-production.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-production-lock-report
          path: docs/eval-report-production-nightly.json
          if-no-files-found: ignore
          retention-days: 90

  eval-heldout-gpu:
    runs-on: [self-hosted, gpu]
    if: startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - name: Held-out eval on release branch
        run: >-
          uv run python scripts/evaluate_baseline.py
          --suite heldout
          --require-answer-path
          --json-output docs/eval-report-heldout-nightly.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-heldout-report
          path: docs/eval-report-heldout-nightly.json
          if-no-files-found: ignore
          retention-days: 90
