name: Feature request
description: Propose a new capability or improvement
title: "feat(scope): "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem and proposed solution. Link related docs or issues if applicable.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Operator UX (web)
        - RAG / chat quality
        - Analytics / Text-to-SQL
        - Ingestion / documents
        - Auth / IAM / RBAC
        - Inventory / maintenance / RCA
        - Deployment / on-prem ops
        - Observability / admin
        - Developer experience
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: Who is affected and what pain does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Neo Chat do differently?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you evaluated

  - type: dropdown
    id: factory_impact
    attributes:
      label: Factory / safety impact
      options:
        - None — DX or cosmetic only
        - Low — operator convenience
        - Medium — workflow change, training needed
        - High — affects cited answers, RBAC, or deployment
    validations:
      required: true

  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a PR for this feature
        - label: I can help test on a factory-like environment
