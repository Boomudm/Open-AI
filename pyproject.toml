[project]
name = "spark"
version = "1.0.0"
description = "Neo Chat — Factory knowledge chat — on-prem AI"
# Python 3.14 dropped private C-API used by psycopg2-binary <2.9.10 and the
# pinned pydantic-core via pyo3 0.22. Stick to 3.11–3.13 LTS-like range.
requires-python = ">=3.11,<3.14"

dependencies = [
    # Web
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.17",
    # DB
    "sqlalchemy==2.0.36",
    "asyncpg>=0.30.0",
    "alembic==1.14.0",
    "greenlet==3.1.1",
    "psycopg2-binary==2.9.10",
    # Vector
    "qdrant-client==1.12.1",
    # LangChain / RAG
    "langchain>=0.3.7,<0.4",
    "langchain-community>=0.3.7,<0.4",
    "langchain-ollama>=0.2.0,<0.3",
    "langgraph>=0.2.50,<0.3",
    "langsmith>=0.1.140,<0.2",
    "sentence-transformers>=4.0,<6",
    # Parsers
    "pypdf==5.1.0",
    "pdfplumber==0.11.4",
    "pdf2image==1.17.0",
    "pytesseract==0.3.13",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "python-docx==1.1.2",
    # Task queue
    "celery==5.4.0",
    "redis==5.2.0",
    # Utilities
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "httpx==0.27.2",
    "boto3>=1.35.0,<2",
    "google-auth==2.37.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
    "pyyaml==6.0.2",
    "filetype==1.2.0",
    "prometheus-client==0.21.0",
    "tiktoken>=0.8.0,<0.10",
    "argon2-cffi==23.1.0",
    "langchain-openai>=0.2.0,<0.3",
    "pythainlp>=5.0,<6",
    "docling>=2.87.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov>=6.0",
    "ruff==0.8.2",
    "mypy==1.13.0",
    "moto[s3]>=5.0.0,<6",
    "reportlab>=4.2.5",  # seed_demo_docs / demo_fixtures PDF generation in CI
]

smoke = [
    "reportlab>=4.2.5",   # used by scripts/smoke_test.py to synthesize a PDF
]

factory = [
    "reportlab>=4.2.5",
]

compliance = [
    "presidio-analyzer>=2.2.354",
]

otel = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
]

ocr = [
    "opencv-python-headless>=4.10.0",
]

speech = [
    "faster-whisper>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "chaos: chaos engineering tests (excluded from default CI)",
]
