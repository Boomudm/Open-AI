# Observability overlay — Prometheus, Grafana, and Jaeger (distributed tracing).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
#
# Set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317 in .env to enable tracing.

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: spark_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: spark_prometheus
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: spark_grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus_data:
  grafana_data:
