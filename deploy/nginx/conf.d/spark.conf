# Neo Chat on-prem — routes browser traffic to web + API.
# SSE paths (chat ask, alerts, ingest progress) disable proxy buffering.
#
# API trusted proxy (app-layer v2): set TRUSTED_PROXIES to match real_ip_from CIDRs
# (e.g. 172.16.0.0/12) so X-Forwarded-For is honored only from nginx peers.

upstream spark_web {
    server web:3000;
    keepalive 16;
}

upstream spark_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Baseline security headers (app middleware also sets these)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Liveness — open to LAN monitoring / load balancers
    location = /healthz {
        proxy_pass http://spark_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Readiness — includes Redis/DB dependency checks
    location = /readyz {
        proxy_pass http://spark_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Admin-only monitoring (adjust CIDR for factory LAN)
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://spark_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Public API docs (Swagger / ReDoc / OpenAPI). Metrics stay LAN-only above.
    location ~ ^/(docs|redoc|openapi\.json)(/.*)?$ {
        proxy_pass http://spark_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── FastAPI backend (includes all SSE streams) ───────────────────────────
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://spark_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRITICAL: token streaming (POST /api/v1/chat/*/ask),
        # GET /api/v1/alerts/stream, GET /api/v1/ingest/jobs/*/stream
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        proxy_set_header Connection "";
    }

    # ── Next.js frontend ─────────────────────────────────────────────────────
    location / {
        proxy_pass http://spark_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
