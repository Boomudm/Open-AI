# Neo Chat — On-Premise / Intranet full stack
#
# Usage (from repo root):
#   cp deploy/.env.onprem.example deploy/.env
#   ./deploy/setup_onprem.sh
#
# Manual:
#   docker compose -f deploy/docker-compose.onprem.yml --env-file deploy/.env up -d --build

name: spark-onprem

x-spark-app-env: &spark-app-env
  APP_ENV: production
  AUTH_REQUIRED: "true"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  OLLAMA_BASE_URL: http://ollama:11434
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-sparkminio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sparkminio}
  S3_BUCKET: ${S3_BUCKET:-spark-documents}
  S3_REGION: ${S3_REGION:-ap-southeast-1}
  MCP_PREDICTIVE_URL: http://predictive_mcp:8100/mcp

x-spark-data-volumes: &spark-data-volumes
  - ${SPARK_DATA_DIR:-./data}/inbox:/app/data/inbox
  - ${SPARK_DATA_DIR:-./data}/raw:/app/data/raw
  - ${SPARK_DATA_DIR:-./data}/documents:/app/data/documents
  - ${SPARK_DATA_DIR:-./data}/machines:/app/data/machines
  - ${SPARK_DATA_DIR:-./data}/feedback:/app/data/feedback
  - ${SPARK_DATA_DIR:-./data}/chat_attachments:/app/data/chat_attachments
  - ${SPARK_DATA_DIR:-./data}/agentic:/app/data/agentic
  - ../scripts:/app/scripts:ro

services:
  # ── Reverse proxy (single LAN entry point) ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: spark_onprem_nginx
    restart: unless-stopped
    ports:
      - "${ONPREM_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  # ── Data stores ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: spark_onprem_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-spark_db}
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - max_connections=200
      - -c
      - work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spark} -d ${POSTGRES_DB:-spark_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-4g}

  redis:
    image: redis:7-alpine
    container_name: spark_onprem_redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.3
    container_name: spark_onprem_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__ON_DISK_PAYLOAD: "true"
      QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD: 50000
      QDRANT__STORAGE__OPTIMIZERS__MEMMAP_THRESHOLD: 200000
      QDRANT__STORAGE__QUANTIZATION__SCALAR__TYPE: int8
      QDRANT__STORAGE__QUANTIZATION__SCALAR__QUANTILE: 0.99
      QDRANT__STORAGE__QUANTIZATION__SCALAR__ALWAYS_RAM: "true"
    deploy:
      resources:
        limits:
          memory: ${QDRANT_MEMORY_LIMIT:-2g}

  minio:
    image: minio/minio:latest
    container_name: spark_onprem_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sparkminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio_init:
    image: minio/mc:latest
    container_name: spark_onprem_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-sparkminio} $${MINIO_ROOT_PASSWORD:-changeme-minio} &&
      mc mb local/$${S3_BUCKET:-spark-documents} --ignore-existing &&
      mc anonymous set none local/$${S3_BUCKET:-spark-documents}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sparkminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-changeme-minio}
      S3_BUCKET: ${S3_BUCKET:-spark-documents}
    restart: "no"

  # ── Local LLM (no cloud dependency) ───────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: spark_onprem_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-2}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}
      NVIDIA_VISIBLE_DEVICES: ${OLLAMA_GPU_DEVICE:-all}
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-16g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${OLLAMA_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── DB migrations (one-shot) ───────────────────────────────────────────────
  db_migrate:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: spark_onprem_migrate
    env_file:
      - .env
    environment:
      <<: *spark-app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── Application tier ──────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: spark_onprem_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *spark-app-env
      NVIDIA_VISIBLE_DEVICES: ${API_GPU_DEVICE:-}
      RAG_RERANK_DEVICE: ${RAG_RERANK_DEVICE:-auto}
    command:
      - uvicorn
      - spark.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --app-dir
      - src
      - --workers
      - "${ONPREM_API_WORKERS:-2}"
      - --timeout-keep-alive
      - "120"
    volumes: *spark-data-volumes
    depends_on:
      db_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      minio_init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz?lite=1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-4g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${API_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

  celery_worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: spark_onprem_celery
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *spark-app-env
      NVIDIA_VISIBLE_DEVICES: ${WORKER_GPU_DEVICE:-}
      RAG_RERANK_DEVICE: ${RAG_RERANK_DEVICE:-auto}
    command:
      - celery
      - -A
      - spark.workers.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --max-tasks-per-child=50
    volumes: *spark-data-volumes
    shm_size: ${CELERY_SHM_SIZE:-2gb}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: ${CELERY_MEMORY_LIMIT:-8g}
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${WORKER_GPU_DEVICE_ID:-0}"]
              capabilities: [gpu]

  celery_beat:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: spark_onprem_celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      <<: *spark-app-env
    command:
      - celery
      - -A
      - spark.workers.celery_app
      - beat
      - --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SPARK_API_URL: ${ONPREM_PUBLIC_URL:-http://spark.lan}
        NEXT_PUBLIC_PASSWORD_LOGIN: ${NEXT_PUBLIC_PASSWORD_LOGIN:-true}
    container_name: spark_onprem_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      SPARK_API_URL: http://api:8000
      NEXT_PUBLIC_SPARK_API_URL: ${ONPREM_PUBLIC_URL:-http://spark.lan}
      NEXT_PUBLIC_PASSWORD_LOGIN: ${NEXT_PUBLIC_PASSWORD_LOGIN:-true}
    depends_on:
      api:
        condition: service_healthy

  # ── Optional: predictive maintenance MCP (enable with --profile mcp) ─────
  predictive_mcp:
    profiles: [mcp]
    image: ${MCP_IMAGE_TAG:-spark-predictive-mcp:0.1.0}
    container_name: spark_onprem_predictive_mcp
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    command:
      - predictive-maintenance-mcp
      - --transport
      - streamable-http
      - --host
      - "0.0.0.0"
      - --port
      - "8100"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
    name: spark_onprem_postgres_data
  redis_data:
    name: spark_onprem_redis_data
  qdrant_data:
    name: spark_onprem_qdrant_data
  minio_data:
    name: spark_onprem_minio_data
  ollama_data:
    name: spark_onprem_ollama_data
